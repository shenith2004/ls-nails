  <script>
    tailwind.config = {
      theme: {

  <style>
    :root {
      --container-max: 1240px;
      --content-px: clamp(1.25rem, 3.5vw, 2.5rem);
    }

    body {
      background-color: #F7F3ED;
      color: #1E140A;
      font-family: 'Outfit', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }

    ::selection {
      background-color: #B8926A;
      color: #F7F3ED;
    }

    h1, h2, h3, h4, h5, h6 {
      font-family: 'Clash Display', sans-serif;
    }

    /* Fluid Island Nav */
    .nav-glass {
      background: rgba(247, 243, 237, 0.92);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
    }

    /* GSAP Base States */
    .gsap-reveal {
      opacity: 0;
      transform: translateY(32px) scale(0.98);
      filter: blur(8px);
    }

    /* Noise Texture */
    .noise-overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      pointer-events: none;
      opacity: 0.032;
      background-image: url('data:image/svg+xml,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)"/%3E%3C/svg%3E');
    }

    .site-container {
      width: 100%;
      max-width: var(--container-max);
      margin-inline: auto;
      padding-inline: var(--content-px);
    }

    /* Keep every archive photo in its original proportions. */
    .gallery-columns { columns: 1; column-gap: 1rem; }
    .gallery-item { display: inline-block; width: 100%; margin-bottom: 1rem; break-inside: avoid; }
    .gallery-photo { display: block; width: 100%; height: auto; max-height: 36rem; object-fit: contain; }
    @media (min-width: 640px) {
      .gallery-columns { columns: 2; column-gap: 1.25rem; }
      .gallery-item { margin-bottom: 1.25rem; }
    }
    @media (min-width: 1024px) {
      .gallery-columns { columns: 3; column-gap: 1.5rem; }
      .gallery-item { margin-bottom: 1.5rem; }
    }
    @media (min-width: 1280px) { .gallery-columns { columns: 4; } }
  </style>
</head>

      Chat now
    </span>
    <div
      class="w-14 h-14 bg-[#1A1208] text-white rounded-full flex items-center justify-center shadow-2xl hover:scale-110 transition-transform duration-300 relative border border-white/10">
      <i class="ph ph-whatsapp-logo text-3xl"></i>
      <span class="absolute top-0 right-0 flex h-3.5 w-3.5">
        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
        <span class="relative inline-flex rounded-full h-3.5 w-3.5 bg-red-500 border-2 border-[#1A1208]"></span>
      </span>
    </div>
  </a>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      gsap.registerPlugin(ScrollTrigger);

      // Hero animation
      gsap.to('.gsap-header', {
        y: 0,
        opacity: 1,
        duration: 1.5,
        stagger: 0.15,
        ease: "power4.out",
        delay: 0.2
      });

      // Cinematic fade-up reveals for gallery items
      const revealElements = document.querySelectorAll('.gsap-reveal');

      ScrollTrigger.batch(revealElements, {
        onEnter: batch => gsap.to(batch, {
          y: 0,
          scale: 1,
          opacity: 1,
          filter: 'blur(0px)',
          duration: 1.4,
          stagger: 0.1,
          ease: "power3.out"
        }),
        start: "top 90%",
      });
    });
  </script>
